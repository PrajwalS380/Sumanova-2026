name: Build apps

# Builds the Android APK and iPhone app on every push to the main branches
# and publishes them as a GitHub pre-release you can download on your phone.
on:
  push:
    branches: [SUM-202601, develop, 'release/**', main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public by design (Row Level Security protects data). Never put the service-role key here.
  VITE_SUPABASE_URL: https://wssfbcscijpwfohhkerz.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qfAQadV-x8WX1SKY4J2SjA_UCh_xyXt
  NODE_VERSION: '22'

jobs:
  web:
    name: Typecheck, test & build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with: { name: web-dist, path: dist, retention-days: 7 }

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: npm ci
      - uses: actions/download-artifact@v5
        with: { name: web-dist, path: dist }
      - run: npx cap sync android
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sumanova.keystore"
            echo "SUMANOVA_KEYSTORE_PATH=$RUNNER_TEMP/sumanova.keystore" >> "$GITHUB_ENV"
            echo "Using release signing key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — APK is signed with a temporary debug key. Updates will require uninstalling first."
          fi
      - name: Build release APK
        working-directory: android
        env:
          SUMANOVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUMANOVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUMANOVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUMANOVA_VERSION_CODE: ${{ github.run_number }}
          SUMANOVA_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SUMANOVA.apk"
      - uses: actions/upload-artifact@v5
        with: { name: android-apk, path: SUMANOVA.apk, retention-days: 30 }

  ios:
    name: iPhone app (unsigned IPA)
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v5
        with: { name: web-dist, path: dist }
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry SUMANOVA-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with: { name: ios-ipa, path: SUMANOVA-unsigned.ipa, retention-days: 30 }

  release:
    name: Publish download
    needs: [android, ios]
    if: always() && needs.android.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { name: android-apk, path: out }
      - uses: actions/download-artifact@v5
        if: needs.ios.result == 'success'
        with: { name: ios-ipa, path: out }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUMANOVA 0.1.${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          files: out/*
          body: |
            **Android:** download `SUMANOVA.apk` on your phone and open it (allow "Install unknown apps" for your browser if asked).
            **iPhone:** `SUMANOVA-unsigned.ipa` must be signed on install — see docs/MOBILE.md. Or use the web app at https://sumanova.vercel.app (Safari → Share → Add to Home Screen).
            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
